[package]
name = "perpetual-dex"
version = "0.1.0"
description = "Perpetual DEX with Orderbook, Margin Trading, and Leverage on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "perpetual_dex"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"]}
anchor-spl = { version = "0.30.1", features = ["metadata", "token_2022_extensions"]}
solana-program = "1.18.18"
spl-token = "=4.0.3"

